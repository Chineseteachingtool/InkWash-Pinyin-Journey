<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨韻拼音行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 水墨江湖裡的說書人，溫和、鼓勵、帶點俠氣
   IDEA: 一卷可以走進去的山水長卷，每位人物都守著一關拼音挑戰
   PICTURE: 2.5D 水墨長卷場景（遠山、近樹、屋舍、人物依遠近縮放遮擋）
   COLOUR and TYPE: 宣紙、焦墨、朱砂印、青瓷；霞鶩文楷 + 思源宋體
   LAYOUT: 遊戲畫面置頂滿寬，HUD 在上，對話框與挑戰卷軸疊在畫面上 */
:root{color-scheme:light dark;--bg:light-dark(#e2d9c5,#15130f);--fg:light-dark(#1f1c18,#ece3cf);--paper:#f1e9d6;--paper2:#e7dcc3;--ink:#1f1c18;--ink2:#5a5348;--seal:#b3321f;--cel:#4f735f;--ind:#34465f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'LXGW WenKai TC','Noto Serif TC',serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:12px max(2vw,8px) 20px}
.paper{background-color:var(--paper);background-image:var(--tex)}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;color:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0}
.seal{width:44px;height:44px;flex:none;background:var(--seal);color:#f8ecdc;display:grid;place-items:center;font:900 26px 'Noto Serif TC',serif;border-radius:6px;box-shadow:inset 0 0 0 3px rgba(248,236,220,.35)}
h1{font:900 clamp(22px,3vw,30px)/1.05 'Noto Serif TC',serif;margin:0;letter-spacing:.04em}
.sub{font-size:13px;color:var(--ink2)}
.who{display:flex;flex-direction:column;gap:4px;margin-left:auto;min-width:200px;flex:0 1 300px}
.who b{font-size:17px}.xpt{font-size:13px;color:var(--ink2)}
.xpbar{height:10px;background:#d9ceb4;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2b2925,var(--cel));transition:width .6s}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;cursor:pointer;min-height:44px;padding:8px 16px;border-radius:8px;border:2px solid var(--ink);background:#f8f1e1;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-align:center}
.btn:hover{background:#fffaee}.btn:focus-visible,.mini button:focus-visible,.spot:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--paper)}.btn.primary:hover{background:#3b372f}
.btn.red{background:var(--seal);border-color:#7d2215;color:#fff4e6}.btn.red:hover{background:#c23b27}
.btn.ghost{background:transparent}.btn.sm{min-height:38px;padding:4px 10px;font-size:15px}
.btn:disabled{cursor:default}
#stage{position:relative;height:clamp(440px,74vh,780px);border:2px solid var(--ink);border-radius:0 0 10px 10px;overflow:hidden;background:var(--paper);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;display:block;cursor:pointer}
.mini{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(241,233,214,.9);border:1.5px solid var(--ink);border-radius:22px;padding:3px;width:min(560px,94%);z-index:3}
.mini button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;padding:4px 2px;border-radius:18px;cursor:pointer;color:var(--ink);min-height:34px;white-space:nowrap}
.mini button.on{background:var(--ink);color:var(--paper)}
.banner{position:absolute;top:58px;left:0;right:0;text-align:center;font:900 clamp(36px,6vw,66px)/1.1 'Noto Serif TC',serif;color:var(--ink);opacity:0;pointer-events:none;text-shadow:0 0 22px var(--paper),0 0 8px var(--paper);transition:opacity .8s;z-index:2}
.banner small{display:block;font:400 17px 'LXGW WenKai TC',serif;margin-top:6px}
.banner.show{opacity:1}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3}
.hint .btn{box-shadow:0 6px 16px rgba(0,0,0,.25);white-space:nowrap}
.keys{position:absolute;right:12px;bottom:10px;font-size:13px;color:var(--ink2);background:rgba(241,233,214,.8);padding:2px 10px;border-radius:12px;z-index:1}
#dialog{position:absolute;left:12px;right:12px;bottom:12px;max-width:900px;margin:0 auto;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;color:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink),0 14px 30px rgba(0,0,0,.3);border-radius:6px;padding:14px 16px;z-index:5}
#portrait{width:120px;height:140px;background:#e9dfc8;border:1.5px solid var(--ink);border-radius:6px}
.dhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:4px}
.dname{font:900 21px 'Noto Serif TC',serif}
.dtext{font-size:18px;min-height:4.6em;white-space:pre-line}
.drec{font-size:14px;color:var(--ink2);margin-top:4px}
.dbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.tier{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:999px;font-size:14px;border:1.5px solid;white-space:nowrap}
.tier i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}.tier i.f{background:currentColor}
.t0{background:#e3eee4;border-color:#4f735f;color:#2b4a39}.t1{background:#e4eaf3;border-color:#34465f;color:#22324a}
.t2{background:#f5e8d2;border-color:#9a6a24;color:#61400f}.t3{background:#f6e0da;border-color:#b3321f;color:#7d2215}
.stg{font-size:14px;color:var(--ink2)}
#modal{position:absolute;inset:0;background:rgba(20,18,14,.55);display:grid;place-items:center;padding:10px;z-index:8}
.panel{width:min(840px,100%);max-height:100%;overflow:auto;color:var(--ink);border:2px solid var(--ink);border-radius:8px;box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink)}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 14px;border-bottom:2px solid var(--ink);background:var(--paper)}
.ph b{font:900 20px 'Noto Serif TC',serif}
.pstat{margin-left:auto;display:flex;gap:12px;font-size:15px;color:var(--ink2)}
#gBody{padding:16px clamp(12px,3vw,28px) 22px}
.q{font-size:19px;margin:2px 0 10px}
.py{font-family:'Noto Serif TC','LXGW WenKai TC',serif;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.opt{display:flex;flex-direction:column;gap:6px}
.choice{font-size:22px;min-height:64px;position:relative;padding:10px 14px}
.choice .k{position:absolute;top:3px;left:8px;font-size:12px;opacity:.5}
.choice.right{background:#dcebdd;border-color:#2f5a43;box-shadow:0 0 0 3px rgba(47,90,67,.3)}
.choice.wrong{background:#f4dbd4;border-color:var(--seal);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.letters{grid-template-columns:repeat(auto-fit,minmax(58px,76px));justify-content:center}
.letters .choice{font-size:42px;min-height:86px;padding:4px}
.gest .choice{flex-direction:column;font-size:18px;gap:2px}
.gest svg{width:70px;height:62px}
.card{display:inline-grid;place-items:center;background:#fffaf0;border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
.flash .card{width:min(270px,72vw);height:180px;font-size:84px;display:grid;margin:0 auto}
.ctype{text-align:center;color:var(--ink2);font-size:14px;margin-top:8px}
.timer{height:8px;width:min(270px,72vw);margin:12px auto;background:#ddd2b8;border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--seal);animation:shrink 2s linear forwards}
.timer.t5 i{animation-duration:5s}
@keyframes shrink{from{width:100%}to{width:0}}
.parts{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
.parts .card{min-width:76px;height:84px;font-size:44px;padding:0 12px}
.parts b{font-size:30px}
.fb{min-height:56px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:17px}
.good{color:#2f5a43;font-weight:700}.oops{color:var(--seal);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.center{justify-content:center;text-align:center}
.tip{color:var(--ink2);margin:0 0 10px}
.hintx{font-size:14px;color:var(--ink2)}
.sticker{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--seal);color:#fff;font-size:38px;line-height:1;flex:none;box-shadow:2px 2px 0 var(--ink)}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:430px;margin:12px auto}
.hole{aspect-ratio:1.35;background:radial-gradient(ellipse at 50% 88%,#3a342b 0 36%,transparent 38%),#e4d8bd;border-radius:12px;border:2px solid var(--ink);position:relative;overflow:hidden}
.mole{position:absolute;left:16%;right:16%;bottom:10%;height:72%;border-radius:12px 12px 4px 4px;background:#fffaf0;border:2px solid var(--ink);font:600 clamp(26px,6vw,40px) 'Noto Serif TC',serif;display:grid;place-items:center;transform:translateY(115%);transition:transform .14s;cursor:pointer;padding:0;color:var(--ink)}
.mole.up{transform:none}.mole.hit{background:#dcebdd}.mole.miss{background:#f4dbd4}
.bigtime{font:900 22px 'Noto Serif TC',serif}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.basket{min-height:120px;flex-direction:column;font-size:20px;border-radius:40px 40px 14px 14px}
.basket small{font-size:15px;color:inherit;opacity:.75}
.sortcard{display:grid;justify-items:center;gap:6px}
.sortcard .card{width:200px;height:120px;font-size:52px}
.passage{background:#fffaf0;border:1.5px solid var(--ink);border-radius:8px;padding:14px 18px;font-size:clamp(19px,2.4vw,23px);line-height:2.05}
.wheelbox{display:grid;justify-items:center;gap:10px}
.wheelbox svg{width:min(300px,80vw);height:auto}
.wring{transition:transform 2.2s cubic-bezier(.15,.85,.2,1);transform-origin:150px 150px}
.room{width:100%;height:auto;max-height:380px;display:block;background:#f3ead7;border:2px solid var(--ink);border-radius:8px}
.spot{cursor:pointer}.spot:hover .hl,.spot:focus .hl{stroke:var(--seal);stroke-width:4}
.spot.no{animation:shake .3s}
.clue{background:#fffaf0;border:2px dashed var(--ink);border-radius:8px;padding:10px 14px;font-size:22px;margin:8px 0 12px}
.ime{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ime input{font:22px 'Noto Serif TC',serif;padding:8px 12px;border:2px solid var(--ink);border-radius:8px;background:#fffaf0;flex:1 1 220px;min-height:48px;color:var(--ink)}
.cands{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fffaf0;border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px}
.note{background:#fffaf0;border:1.5px solid var(--ink);border-radius:4px;padding:12px 16px;font-size:21px;line-height:1.9;box-shadow:3px 3px 0 rgba(31,28,24,.25);transform:rotate(-.6deg)}
.result{text-align:center;padding:6px 0}
.score{font:900 64px/1.1 'Noto Serif TC',serif;color:var(--seal)}
.verdict{font-size:20px;margin:6px 0}
.lvup{display:inline-block;margin:10px 0;padding:6px 16px;border:2px solid var(--seal);color:var(--seal);border-radius:8px;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid #cdbf9f;padding:8px 6px;text-align:left;vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--ink)}
td.n{text-align:right;white-space:nowrap}
.gtag{display:inline-flex;gap:4px;align-items:center;margin:2px 6px 2px 0;padding:2px 8px;border-radius:6px;border:1px solid #bfae8a;font-size:13px;white-space:nowrap}
.gtag.ok{background:#dcebdd;border-color:#2f5a43}.gtag.mid{background:#f5ead2;border-color:#9a6a24}
h3{font:900 19px 'Noto Serif TC',serif;margin:18px 0 6px}
textarea{width:100%;min-height:90px;font:13px/1.4 monospace;border:1.5px solid var(--ink);border-radius:6px;padding:8px;background:#fffaf0;color:var(--ink)}
#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(241,233,214,.5);z-index:9;padding:12px}
.startcard{width:min(520px,100%);color:var(--ink);border:2px solid var(--ink);border-radius:8px;box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--ink),0 20px 40px rgba(0,0,0,.25);padding:22px clamp(16px,4vw,30px);text-align:center;max-height:100%;overflow:auto}
.startcard h2{font:900 clamp(38px,7vw,56px)/1.05 'Noto Serif TC',serif;margin:6px 0 4px;letter-spacing:.06em}
.startcard input{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:8px;background:#fffaf0;width:100%;min-height:46px;margin:12px 0;color:var(--ink)}
.startcard .row{justify-content:center}
.small{font-size:13px;color:var(--ink2)}
footer{font-size:13px;color:var(--fg);opacity:.75;margin-top:10px;line-height:1.6}
@media(max-width:600px){
 #dialog{grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px;left:6px;right:6px;bottom:6px}
 #portrait{width:76px;height:89px}.dtext{font-size:16px;min-height:3.5em}
 .keys{display:none}.who{margin-left:0;flex-basis:100%}
 .choice{font-size:19px}.score{font-size:48px}
 table{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <header class="hud paper">
  <div class="seal">拼</div>
  <div><h1 id="tTitle">墨韻拼音行</h1><div class="sub" id="tSub"></div></div>
  <div class="who"><b id="hName"></b><div class="xpbar"><i id="hBar"></i></div><span class="xpt" id="hXp"></span></div>
  <div class="tools">
   <button class="btn sm" id="bLang" aria-label="切換語言 Switch language"></button>
   <button class="btn sm" id="bRec"></button>
   <button class="btn sm" id="bSnd" aria-pressed="true"></button>
  </div>
 </header>
 <div id="stage">
  <canvas id="cv" aria-label="ink scene"></canvas>
  <nav class="mini" id="mini"></nav>
  <div class="banner" id="banner"></div>
  <div class="hint" id="hint" hidden><button class="btn primary" id="hintBtn"></button></div>
  <div class="keys" id="tKeys"></div>
  <div id="dialog" class="paper" hidden>
   <canvas id="portrait" width="240" height="280"></canvas>
   <div>
    <div class="dhead"><span class="dname" id="dName"></span><span id="dTier"></span></div>
    <div class="dtext" id="dText"></div>
    <div class="drec" id="dRec"></div>
    <div class="dbtns" id="dBtns"></div>
   </div>
  </div>
  <div id="modal" hidden>
   <div class="panel paper" role="dialog" aria-modal="true">
    <div class="ph"><span id="gTier"></span><b id="gName"></b><div class="pstat"><span id="gProg"></span></div><button class="btn sm" id="gClose"></button></div>
    <div id="gBody"></div>
   </div>
  </div>
  <div id="start">
   <div class="startcard paper">
    <div class="row" style="justify-content:flex-end;margin-bottom:-30px"><button class="btn sm ghost" id="bLang2"></button></div>
    <div class="seal" style="margin:0 auto">墨</div>
    <h2>墨韻拼音行</h2>
    <p id="tIntro"></p>
    <div id="cont"></div>
    <label for="nameIn" class="small" id="tNameL"></label>
    <input id="nameIn" maxlength="14" value="">
    <div class="row"><button class="btn primary" id="bNew"></button><button class="btn ghost" id="bImp"></button></div>
    <div id="impBox" hidden><textarea id="impTxt"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" id="bImpGo"></button><span id="impMsg" class="small"></span></div></div>
    <p class="small" id="tSaveNote"></p>
   </div>
  </div>
 </div>
 <footer id="tFoot"></footer>
</div>
<script>
{
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const SPK='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

/* ---------- 語言 ---------- */
const LKEY='moyun-pinyin-lang';
let LANG=(()=>{try{const v=localStorage.getItem(LKEY);if(v)return v}catch(e){}return /^zh/i.test(navigator.language||'')?'zh':'en'})();
const L=(zh,en)=>LANG==='en'?en:zh;
const tr=p=>Array.isArray(p)?L(p[0],p[1]):p;
const TAGS=()=>L(['甲','乙','丙','丁'],['A','B','C','D']);

/* ---------- 紙紋 ---------- */
{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const d=x.createImageData(160,160);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*26;d.data[i]=d.data[i+1]=d.data[i+2]=120;d.data[i+3]=v}
 x.putImageData(d,0,0);x.strokeStyle='rgba(120,100,70,.08)';for(let i=0;i<40;i++){x.beginPath();const a=Math.random()*160,b=Math.random()*160;x.moveTo(a,b);x.lineTo(a+Math.random()*30-15,b+Math.random()*30-15);x.stroke()}
 document.documentElement.style.setProperty('--tex',`url(${c.toDataURL()})`);}

/* ---------- 語音與音效 ---------- */
let VOICES=[];const loadV=()=>{try{VOICES=speechSynthesis.getVoices()}catch(e){}};
if('speechSynthesis' in window){loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}}
const hasZh=()=>VOICES.some(v=>/^(zh|cmn)/i.test(v.lang));
function say(t,rate=.78){try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';const v=VOICES.find(v=>/zh[-_]CN/i.test(v.lang))||VOICES.find(v=>/^(zh|cmn)/i.test(v.lang));if(v)u.voice=v;u.rate=rate;s.speak(u)}catch(e){}}
let AC=null,SND=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function pluck(f,t0=0,d=.5,v=.16,type='triangle'){const a=ac();if(!a||!SND)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={ok(){pluck(659);pluck(988,.09)},bad(){pluck(185,0,.3,.07,'square')},up(){[523,587,659,784,880,1047].forEach((f,i)=>pluck(f,i*.09,.7))},tap(){pluck(440,0,.12,.07)}};

/* ---------- 存檔 ---------- */
const KEY='moyun-pinyin-rpg-v1';
const fresh=name=>({name,xp:0,games:{},log:[],x:200,d:.55,expert:false,created:Date.now()});
const loadS=()=>{try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
let S=null;
const LV=[[0,'拼音學徒','Pinyin Apprentice'],[120,'拼音童生','Pinyin Pupil'],[300,'拼音秀才','Pinyin Scholar'],[550,'拼音舉人','Pinyin Graduate'],[900,'拼音進士','Pinyin Laureate'],[1400,'拼音狀元','Pinyin Champion'],[2000,'拼音專家','Pinyin Expert']];
const lvOf=xp=>{let i=0;while(i<LV.length-1&&xp>=LV[i+1][0])i++;return i};

const TM={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù','ü':'ǖǘǚǜ'};
function markIdx(s){for(const v of['a','o','e'])if(s.includes(v))return s.indexOf(v);if(s.includes('iu'))return s.indexOf('iu')+1;if(s.includes('ui'))return s.indexOf('ui')+1;for(let i=0;i<s.length;i++)if('iuü'.includes(s[i]))return i;return -1}
const addTone=(s,t)=>{const i=markIdx(s);return i<0?s:s.slice(0,i)+TM[s[i]][t-1]+s.slice(i+1)};
function ruleOf(s){if(s.includes('a'))return L('口訣：有 a 不放過，標在 a 上。','Rule: if there is an a, the mark goes on a.');if(s.includes('o'))return L('口訣：沒有 a，就找 o。','Rule: no a? Look for o.');if(s.includes('e'))return L('口訣：沒有 a、o，就找 e。','Rule: no a or o? Look for e.');if(s.includes('iu')||s.includes('ui'))return L('口訣：i、u 並列標在後。','Rule: when i and u sit together, mark the second one.');return L('只有一個母音，就標在它頭上'+(s.includes('i')?'（i 標調時要去掉上面的點）':'')+'。','Only one vowel, so the mark goes on it'+(s.includes('i')?' (i drops its dot when it carries a tone mark)':'')+'.')}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/ü/g,'v').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');

 c.fillStyle='rgba(255,250,236,.38)';c.beginPath();c.moveTo(0,gy(.32));c.bezierCurveTo(W*.3,gy(.28),W*.6,gy(.38),W,gy(.33));c.lineTo(W,gy(.78));c.bezierCurveTo(W*.6,gy(.74),W*.3,gy(.82),0,gy(.77));c.fill();
 const lx0=sx(2700),lx1=sx(3900);if(lx1>0&&lx0<W){c.fillStyle='rgba(110,135,140,.28)';c.beginPath();c.moveTo(lx0,HZ+2);c.lineTo(lx1,HZ+2);c.quadraticCurveTo(lx1-40*U,gy(.16),lx1-200*U,gy(.17));c.lineTo(lx0+200*U,gy(.17));c.quadraticCurveTo(lx0+40*U,gy(.16),lx0,HZ+2);c.fill();
  c.strokeStyle='rgba(60,80,85,.35)';c.lineWidth=1*U;for(let k=0;k<14;k++){const x=lx0+(k*83%1100)*U+120*U,y=HZ+8*U+((k*37)%40)*U*.6;c.beginPath();c.moveTo(x,y);c.lineTo(x+(30+(k%3)*14)*U,y);c.stroke()}}
 GROUND.forEach(g=>{const X=sx(g.x);if(X<-120||X>W+20)return;const Y=gy(g.d),s=sc(g.d);c.strokeStyle=`rgba(60,50,35,${g.a})`;c.lineWidth=g.w*s;c.beginPath();c.moveTo(X,Y);c.quadraticCurveTo(X+g.l*s*.5,Y-1.5*s,X+g.l*s,Y+1*s);c.stroke()});
 c.strokeStyle='rgba(40,55,40,.5)';TUFT.forEach(g=>{const X=sx(g.x);if(X<-20||X>W+20)return;const Y=gy(g.d),s=sc(g.d)*g.s;c.lineWidth=1.2*s;c.beginPath();c.moveTo(X-5*s,Y-8*s);c.lineTo(X,Y);c.lineTo(X+2*s,Y-11*s);c.moveTo(X,Y);c.lineTo(X+7*s,Y-7*s);c.stroke()});
 const ents=[...PROPS,...NPCS.map(n=>({kind:'npc',n,x:n.x,d:n.d})),{kind:'pl',x:player.x,d:player.d}].filter(e=>{const X=sx(e.x);return X>-420*U&&X<W+420*U}).sort((a,b)=>a.d-b.d);
 for(const e of ents){const X=sx(e.x),Y=gy(e.d),s=sc(e.d);
  if(e.kind==='prop'){c.save();c.translate(X,Y);c.scale(s,s);c.lineCap='round';c.lineJoin='round';PROP[e.t](e.v);c.restore()}
  else if(e.kind==='npc'){const n=e.n;if(Math.abs(player.x-n.x)<260&&!DLG)n.face=player.x<n.x?-1:1;person(c,X,Y,s,n.look,t+n.x,false,n.face)}
  else person(c,X,Y,s,player.look,t,player.moving,player.face)}
 const fs=Math.max(12,13*U);
 for(const n of NPCS){const X=sx(n.x);if(X<-90||X>W+90)continue;const Y=gy(n.d),s=sc(n.d),ty=Y-108*s,nm=tr(n.name);
  c.font=`700 ${fs}px 'LXGW WenKai TC',serif`;const tw=c.measureText(nm).width+14;c.fillStyle='rgba(246,239,224,.92)';c.strokeStyle='#1f1c18';c.lineWidth=1.2;c.beginPath();c.roundRect?c.roundRect(X-tw/2,ty-11,tw,22,5):c.rect(X-tw/2,ty-11,tw,22);c.fill();c.stroke();txt(nm,X,ty+1,fs,'#1f1c18',"700 %spx 'LXGW WenKai TC',serif");
  if(!S)continue;const by=ty-24+Math.sin(t*3+n.x)*2.5;
  if(n.game){if(mastered(n.game)){c.fillStyle='#b3321f';c.fillRect(X-11,by-11,22,22);txt('通',X,by+1,14,'#fff4e6')}else if(!rec(n.game).plays){c.fillStyle='#b3321f';dot(c,X,by,11);txt('!',X,by+1,15,'#fff')}}
  else{c.fillStyle='#1f1c18';dot(c,X,by,10);txt('?',X,by+1,13,'#f6efe0')}}
 if(S){const X=sx(player.x),Y=gy(player.d)-108*sc(player.d);txt('▼',X,Y+8,10*U+4,'#b3321f');}
}
requestAnimationFrame(frame);

/* ---------- 開始畫面 ---------- */
function begin(s){S=s;player.x=s.x||200;player.d=s.d??.55;camX=Math.max(0,player.x-W/U/2);$('#start').hidden=true;hud();save();curZone=-1;ac()}
$('#bNew').onclick=()=>begin(fresh(($('#nameIn').value||L('小俠','Hero')).trim().slice(0,14)||L('小俠','Hero')));
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bNew').click()});
$('#bImp').onclick=()=>{$('#impBox').hidden=!$('#impBox').hidden};
$('#bImpGo').onclick=()=>{try{const o=dec($('#impTxt').value);if(!o||typeof o.xp!=='number')throw 0;begin(Object.assign(fresh(o.name||'Hero'),o))}catch(e){$('#impMsg').textContent=L('存檔碼看起來不完整，請重新複製。','That save code looks incomplete. Please copy it again.')}};
renderStatic();
}
